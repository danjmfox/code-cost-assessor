jobs:
  - id: J-01
    title: Evaluate an AI-built codebase I didn't write
    statement: >
      When I inherit or evaluate a codebase built with AI assistance,
      I want to quantify its true effort equivalent and current health,
      so I can benchmark it against future projects and make defensible
      investment or ownership decisions.
    dimensions:
      functional: >
        Produce a per-session cost estimate (in hours and optionally USD)
        alongside health signals, comparable across repositories.
      emotional: >
        Feel confident assessing code I didn't write, without relying
        solely on subjective code review.
      social: >
        Have a reproducible, methodology-backed number to present when
        justifying tooling investment or pricing a codebase handoff.
    four_forces:
      push: >
        Subjective assessments of AI-built code are unreliable and
        undefendable. No standard methodology exists for answering
        "what would this have cost without AI?"
      pull: >
        A reproducible, per-repo number that travels — like COCOMO —
        and accumulates benchmarking value across projects over time.
      anxiety: >
        The methodology has ±40% confidence. Will stakeholders trust
        numbers derived from token throughput rates?
      habit: >
        Currently reviewing AI-built code manually, forming intuitive
        estimates that can't be reproduced or compared.
    opportunity_score: 9
    notes: >
      Primary job — every design decision should serve this.
      The builder self-audit is a secondary use case (same tool,
      same output, lower-stakes audience).

  - id: J-02
    title: Detect high-velocity sessions that degraded health
    statement: >
      When reviewing a codebase's development history,
      I want to correlate fast-moving sessions with health signal drops,
      so I can direct code review attention to the riskiest windows.
    dimensions:
      functional: >
        Per-session view showing effort hours alongside health delta
        (dead code, duplication, complexity changes).
      emotional: >
        Feel like the review time is spent on the right things.
      social: >
        Justify targeted review focus to a team without reading
        every commit.
    four_forces:
      push: >
        All commits look the same in a flat git log. No signal
        about which sessions were highest risk.
      pull: >
        A timeline that makes the correlation visible — high hours
        + health drop = flag for review.
      anxiety: >
        Health analysis requires fallow to be installed. Tool
        should degrade gracefully if it isn't.
      habit: >
        Currently scanning git log + blame manually, or not at all.
    opportunity_score: 7
    notes: >
      Secondary job — serves both auditor and ongoing tech lead
      use cases. Fallow integration is a hard dependency for this job;
      the tool must degrade gracefully when fallow is absent.

  - id: J-03
    title: Calibrate the estimator to my team's actual throughput
    statement: >
      When the Swoopy defaults don't reflect my team's real productivity,
      I want to plug in a custom estimator module at runtime,
      so I can produce estimates calibrated to our actual throughput
      without forking or patching the tool.
    dimensions:
      functional: >
        Pass a custom estimator (TypeScript/JavaScript module) to `analyse()`
        via Ports injection, or load one at runtime via `--estimator <path>`.
        The module controls the full estimate pipeline for a diff.
      emotional: >
        Feel confident the estimate reflects a real, auditable methodology —
        not a generic benchmark that stakeholders might legitimately challenge.
      social: >
        Demonstrate to stakeholders that the model is calibrated: "we ran
        this on 20 sessions and tuned our own rates" is more credible than
        citing Swoopy defaults.
    four_forces:
      push: >
        Swoopy throughput rates (250/400/500/600 tokens/day) are generic
        benchmarks. Teams with empirical throughput data cannot express
        that knowledge without modifying the source.
      pull: >
        A documented port type + runtime loading = publishable custom
        estimators. Teams can calibrate once and share the module.
      anxiety: >
        Will a custom estimator break the output format? Does the
        EffortEstimate shape (confidence, note) still communicate
        the methodology honestly?
      habit: >
        Currently accepting Swoopy defaults, manually post-processing
        output, or simply not using the tool for repos where the rates
        feel wrong.
    opportunity_score: 6
    notes: >
      Developer extensibility job. Primary beneficiary is the auditor
      (more defensible output) via developer tooling. Port must enforce
      the EffortEstimate contract so the methodology note remains honest.
      Emerged from feature estimator-port-adapter (2026-05-22).
